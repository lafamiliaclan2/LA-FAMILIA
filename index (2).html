<!DOCTYPE html>
<html lang="sq"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA FAMILIA — Best Clan in Albania</title>
<style>
:root{color-scheme:dark;--bg:#050505;--card:#111;--line:#2a2a2a;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#d4af37;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,Arial,sans-serif}
.w{max-width:960px;margin:auto;padding:0 18px}
header{text-align:center;padding:48px 0 28px;background:radial-gradient(circle at 50% 0,#222 0,transparent 60%)}
header img{width:150px;height:150px;border-radius:50%;box-shadow:0 0 40px rgba(212,175,55,.25)}
h1{font-size:clamp(34px,9vw,64px);letter-spacing:.12em;margin:14px 0 4px;font-weight:900}
.tag{color:var(--ac);letter-spacing:.3em;font-weight:700;font-size:14px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
a.b,button.b{background:var(--ac);color:#000;border:0;padding:11px 20px;border-radius:8px;font-weight:800;text-decoration:none;cursor:pointer;font-size:15px;display:inline-block}
a.b.o,button.b.o{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.d{background:#8b1a1a;color:#fff}
section{padding:34px 0;border-top:1px solid var(--line)}
h2{font-size:22px;letter-spacing:.15em;margin:0 0 18px;text-transform:uppercase}h2:before{content:"";display:inline-block;width:6px;height:20px;background:var(--ac);margin-right:10px;vertical-align:-3px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.c b{display:block;font-size:18px}.r{color:var(--ac);font-size:12px;letter-spacing:.2em;font-weight:800}.m{color:var(--mu);font-size:13px}
.c a{color:var(--tx)}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--ac);margin-bottom:8px;display:block}.th{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input,select{width:100%;padding:12px;background:#000;color:var(--tx);border:1px solid var(--line);border-radius:8px;font-size:16px}
.msg{background:#000;border:1px dashed var(--ac);border-radius:8px;padding:14px;margin:14px 0;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
footer{text-align:center;padding:36px 18px 48px;border-top:1px solid var(--line);color:var(--mu)}
footer strong{display:block;color:var(--tx);letter-spacing:.1em;margin-bottom:10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;overflow:auto;z-index:20;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 30px}
#ov .box{max-width:640px;margin:auto;background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:20px}
.mr{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.hide{display:none}
</style></head><body>

</div></header>
<main class="w">
<section id="staff"><h2>Staffi ynë</h2><div class="g" id="sl"></div></section>
<section id="apliko"><h2>Apliko për clan</h2>
<div class="c">
<label>Emri në TikTok</label><input id="ft" placeholder="p.sh. emri_im">
<label>ID në lojë</label><input id="fi" placeholder="ID-ja jote në Car Parking">
<label>Zgjidh liderin</label><select id="fl"></select>
<div class="msg" id="pm"></div>
<div class="row"><button class="b" id="cp">Kopjo mesazhin</button><a class="b o" id="ot" target="_blank" rel="noopener">Hap TikTok të liderit</a></div>
</div></section>
<section id="kontakt"><h2>Kontakt me liderat</h2><div class="g" id="kl"></div>
<h2 style="margin-top:28px">Na ndiqni në TikTok</h2><div class="row" id="fw"></div></section>
</main>
<footer><strong>LA FAMILIA IS THE BEST CLAN IN WORLD CPM</strong>
<button class="b o" id="ab" style="padding:6px 14px;font-size:13px">Admin</button></footer>

<div id="ov"><div class="box">
<div class="row" style="justify-content:space-between"><h2 style="margin:0">Admin</h2><button class="b o" id="x">Mbyll</button></div>
<div id="lo"><label>Kodi i administrimit</label><input id="cd" type="password" autocomplete="off"><p class="m" id="er" style="color:#e66"></p><button class="b" id="go">Hyr</button></div>
<div id="pn" class="hide">
<label>Emri i clanit</label><input id="en">
<label>Ndrysho logon</label><input id="ef" type="file" accept="image/*">
<h2 style="margin:22px 0 6px;font-size:16px">Lojtarët</h2><div id="ml"></div>
<div class="c" style="margin-top:14px"><b id="ft2">Shto lojtar</b>
<label>Emri</label><input id="an"><label>Roli</label>
<select id="ar"><option>LEADER</option><option>LEADER2</option><option>PRESIDENT</option><option selected>MEMBER</option></select>
<label>TikTok (pa @, opsionale)</label><input id="at"><label>ID në lojë (opsionale)</label><input id="ai"><label>Foto (opsionale)</label><input id="ap" type="file" accept="image/*"><div class="row" style="margin-top:8px;align-items:center"><img id="pv" class="th hide" alt=""><button class="b d hide" id="rp" style="padding:6px 12px">Hiq foton</button></div>
<div class="row" style="margin-top:12px"><button class="b" id="as">Shto</button><button class="b o hide" id="ac">Anulo</button></div></div>
<p class="m" id="st"></p>
</div></div></div>

<script>
const CODE="LAFAMILIA2026@2027";
const LOGO=document.getElementById("lg").src;
let S={name:"LA FAMILIA",logo:LOGO,members:[
{n:"ZIRO",r:"LEADER",t:"lf_ziro"},{n:"BLACK",r:"LEADER2",t:"lf_black"},{n:"KRUTANI",r:"LEADER2",t:"krutan111"},{n:"SIRGI",r:"LEADER2",t:""},
{n:"TOTO",r:"PRESIDENT",t:""},{n:"LALI 0 FAMOS",r:"MEMBER",t:""}]};
const FOLLOW=["lf_kristi","lf_black","krutan111","skmtvogla6"];
const $=i=>document.getElementById(i);let ref=null,edit=-1,db=null,ok=false,ph="";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LD=()=>S.members.filter(m=>/^LEADER/.test(m.r)&&m.t);
const ORD={LEADER:0,LEADER2:1,PRESIDENT:2,MEMBER:3};
function render(){
 $("cn").textContent=S.name;$("lg").src=S.logo||LOGO;document.title=S.name+" — Best Clan in Albania";
 const ms=[...S.members].sort((a,b)=>ORD[a.r]-ORD[b.r]);
 $("sl").innerHTML=ms.map(m=>`<div class="c">${m.p?`<img class="av" src="${esc(m.p)}" alt="">`:""}<div class="r">${esc(m.r)}</div><b>${esc(m.n)}</b>${m.t?`<a class="m" href="https://www.tiktok.com/@${esc(m.t)}" target="_blank" rel="noopener">@${esc(m.t)}</a>`:""}${m.i?`<div class="m">ID: ${esc(m.i)}</div>`:""}</div>`).join("");
 $("kl").innerHTML=LD().map(m=>`<div class="c"><div class="r">${esc(m.r)}</div><b>${esc(m.n)}</b><a class="b o" style="margin-top:8px;padding:7px 14px" href="https://www.tiktok.com/@${esc(m.t)}" target="_blank" rel="noopener">@${esc(m.t)}</a></div>`).join("");
 $("fw").innerHTML=FOLLOW.map(t=>`<a class="b o" href="https://www.tiktok.com/@${t}" target="_blank" rel="noopener">@${t}</a>`).join("");
 const v=$("fl").value;$("fl").innerHTML=LD().map((m,i)=>`<option value="${i}">${esc(m.n)} (@${esc(m.t)})</option>`).join("");if(v)$("fl").value=v;
 msg();adm();
}
function msg(){
 const l=LD()[$("fl").value||0];
 $("pm").textContent=`Përshendetje Leader! Unë jam ${$("ft").value||"______"} dhe ID ime është ${$("fi").value||"______"} a më pranoni mua në clanin tuaj? Faleminderit!`;
 if(l)$("ot").href="https://www.tiktok.com/@"+l.t;
}
["ft","fi","fl"].forEach(i=>$(i).addEventListener("input",msg));
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("pm").textContent);$("cp").textContent="U kopjua ✓"}catch(e){const r=document.createRange();r.selectNode($("pm"));getSelection().removeAllRanges();getSelection().addRange(r);$("cp").textContent="Shtyp Kopjo"}setTimeout(()=>$("cp").textContent="Kopjo mesazhin",2000)};
function adm(){
 $("en").value=S.name;
 $("ml").innerHTML=S.members.map((m,i)=>`<div class="mr"><div>${m.p?`<img class="th" src="${esc(m.p)}" alt="">`:""}<b>${esc(m.n)}</b> <span class="m">${esc(m.r)}${m.t?" · @"+esc(m.t):""}${m.i?" · ID "+esc(m.i):""}</span></div><div class="row"><button class="b o" style="padding:6px 12px" data-e="${i}">Ndrysho</button><button class="b d" style="padding:6px 12px" data-d="${i}">Hiq</button></div></div>`).join("");
}
async function save(){
 try{if(!db)throw 0;await db.doc("site/main").set(S);$("st").textContent="U ruajt për të gjithë vizitorët ✓"}
 catch(e){$("st").textContent="Ruajtja e përhershme nuk është e disponueshme tani; ndryshimi vlen vetëm këtu."}
 render();
}
$("ml").onclick=e=>{const d=e.target.dataset;
 if(d.d!==undefined){if(confirm("Ta heq këtë lojtar?")){S.members.splice(+d.d,1);save()}}
 if(d.e!==undefined){edit=+d.e;const m=S.members[edit];$("an").value=m.n;$("ar").value=m.r;$("at").value=m.t||"";$("ai").value=m.i||"";ph=m.p||"";pv();$("as").textContent="Ruaj ndryshimin";$("ft2").textContent="Ndrysho lojtar";$("ac").classList.remove("hide")}};
function reset(){edit=-1;ph="";$("ap").value="";pv();["an","at","ai"].forEach(i=>$(i).value="");$("as").textContent="Shto";$("ft2").textContent="Shto lojtar";$("ac").classList.add("hide")}
function pv(){$("pv").src=ph||"";$("pv").classList.toggle("hide",!ph);$("rp").classList.toggle("hide",!ph)}
$("ap").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);ph=c.toDataURL("image/jpeg",.75);pv()};im.src=URL.createObjectURL(f)};
$("rp").onclick=()=>{ph="";$("ap").value="";pv()};
$("ac").onclick=reset;
$("as").onclick=()=>{const n=$("an").value.trim();if(!n)return;
 const m={n,r:$("ar").value,t:$("at").value.trim().replace(/^@/,""),i:$("ai").value.trim(),p:ph};
 edit>=0?S.members[edit]=m:S.members.push(m);reset();save()};
$("en").onchange=()=>{S.name=$("en").value.trim()||S.name;save()};
$("ef").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=256;c.getContext("2d").drawImage(im,0,0,256,256);S.logo=c.toDataURL("image/jpeg",.85);save()};im.src=URL.createObjectURL(f)};
$("ab").onclick=()=>{$("ov").style.display="block";$("lo").classList.toggle("hide",ok);$("pn").classList.toggle("hide",!ok)};
$("x").onclick=()=>$("ov").style.display="none";
$("go").onclick=()=>{if($("cd").value===CODE){ok=true;$("cd").value="";$("er").textContent="";$("lo").classList.add("hide");$("pn").classList.remove("hide")}else $("er").textContent="Kod i gabuar."};
$("cd").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
render();
(async()=>{try{db=await claude.use("db");if(!db)return;
 db.doc("site/main").onSnapshot(s=>{if(s.exists){const d=s.data();if(d&&Array.isArray(d.members)){S={...S,...d};render()}}},()=>{})}catch(e){}})();
</script></body></html>
